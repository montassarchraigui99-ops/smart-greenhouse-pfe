version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: cybercortex-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -i healthcheck || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  backend:
    build: .
    container_name: cybercortex-backend
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      - PORT=5000
      - MQTT_BROKER_URL=mqtt://broker.hivemq.com:1883
    ports:
      - "5000:5000"
    volumes:
      - ./config:/usr/src/app/config
    restart: always
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }).on('error', () => process.exit(1));" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
